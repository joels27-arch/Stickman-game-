<style>
/* Layout: one full-bleed 3D canvas; menus float over it as chunky toy-box cards. */
:root {
  color-scheme: light;
  --ink: #23314d;
  --cream: #fffaf0;
  --sky: #8fd3ff;
  --go: #4cd964;
  --go-dark: #23a03a;
  --blue: #3fa9ff;
  --blue-dark: #1f74d6;
  --gold: #ffcf3a;
  --red: #ff5a4e;
  --muted: #5b6784;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  -webkit-user-select: none;
  user-select: none;
}
#scene { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; touch-action: none; }

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
  z-index: 5;
  background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.04), rgba(20, 60, 120, 0.32));
}
.panel {
  width: min(560px, 100%);
  margin: auto;
  background: var(--cream);
  border: 5px solid var(--ink);
  border-radius: 28px;
  padding: 20px 20px 18px;
  box-shadow: 0 10px 0 var(--ink), 0 22px 40px rgba(0, 0, 0, 0.25);
  display: grid;
  gap: 12px;
}
.logo {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(44px, 12vw, 72px);
  line-height: 0.9;
  margin: 0;
  text-align: center;
  color: var(--gold);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  text-wrap: balance;
}
.logo span { color: var(--go); }
.tag { text-align: center; margin: 0; font-weight: 800; color: var(--muted); }
.label { font-weight: 900; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card {
  border: 4px solid var(--ink);
  border-radius: 16px;
  background: #fff;
  padding: 4px 2px 6px;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  transition: transform 100ms ease;
}
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; max-width: 100%; }
.card b { display: block; font-family: var(--display); font-weight: 400; font-size: 17px; }
.card[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--gold); transform: translateY(-3px); }
.card:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 3px solid var(--blue-dark); outline-offset: 3px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; }
.seg button { font: 800 16px var(--body); color: var(--ink); background: #fff; border: 0; padding: 9px 4px; cursor: pointer; }
.seg button + button { border-left: 3px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--gold); }

.btn {
  font-family: var(--display);
  font-weight: 400;
  font-size: 26px;
  padding: 12px 22px;
  width: 100%;
  border: 4px solid var(--ink);
  border-radius: 18px;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(#6ff07f, var(--go-dark));
  box-shadow: 0 6px 0 var(--ink);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { filter: grayscale(0.8); opacity: 0.7; cursor: default; }
.btn.blue { background: linear-gradient(#7cc8ff, var(--blue-dark)); }
.btn.small { font-size: 18px; padding: 8px 14px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }

.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 13px; font-weight: 800; text-align: center; color: var(--muted); }
.keys div { background: #eef3fb; border-radius: 12px; padding: 8px 4px; }
.keys strong { display: block; color: var(--ink); font-size: 15px; }
.note { text-align: center; font-size: 13px; font-weight: 800; color: var(--muted); margin: 0; min-height: 1.2em; }
.note.err { color: #c8362b; }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.hud-top {
  position: absolute;
  top: max(10px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 12px;
}
.big {
  font-family: var(--display);
  color: #fff;
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
#place { font-size: 46px; min-width: 88px; }
#place sup { font-size: 22px; }
#timer { font-size: 30px; min-width: 76px; text-align: right; }
.track-bar { position: relative; flex: 1; min-width: 0; height: 18px; border: 4px solid var(--ink); border-radius: 12px; background: linear-gradient(#bff59a, #71cf4c); }
.track-bar .flag { position: absolute; right: -10px; top: -16px; font-size: 26px; }
.dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid var(--ink); }
.dot.me { width: 28px; height: 28px; margin: -14px 0 0 -14px; z-index: 2; box-shadow: 0 0 0 3px #fff; }
#countdown { position: absolute; top: 32%; left: 0; right: 0; text-align: center; font-size: clamp(90px, 24vw, 170px); color: var(--gold); -webkit-text-stroke: 5px var(--ink); text-shadow: 0 10px 0 var(--ink); }
#countdown.pop { animation: pop 0.45s ease-out; }
@keyframes pop { 0% { transform: scale(1.8); opacity: 0; } 60% { transform: scale(0.92); opacity: 1; } 100% { transform: scale(1); } }
#banner { position: absolute; top: 21%; left: 0; right: 0; text-align: center; font-size: clamp(34px, 8vw, 60px); opacity: 0; transition: opacity 200ms; }
#banner.show { opacity: 1; }
#hint {
  position: absolute;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 0 var(--ink), 0 0 6px rgba(0, 0, 0, 0.4);
  transition: opacity 600ms;
}
#quit { pointer-events: auto; position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; font-size: 15px; padding: 6px 12px; background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); }

/* results */
.title { font-family: var(--display); font-weight: 400; font-size: 38px; text-align: center; margin: 0; }
.podium { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.podium li { display: grid; grid-template-columns: 46px 60px minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 4px solid var(--ink); border-radius: 18px; background: #fff; padding: 4px 12px 4px 6px; }
.podium li.me { background: #fff2bf; }
.podium .pl { font-family: var(--display); font-size: 28px; text-align: center; }
.podium img { width: 60px; height: 60px; object-fit: contain; }
.podium .who { font-weight: 900; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .who small { display: block; font-size: 12px; color: var(--muted); }
.podium .tm { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }

@media (max-height: 560px) {
  .panel { padding: 14px; gap: 8px; }
  .card img { aspect-ratio: 1.5; }
}
@media (prefers-reduced-motion: reduce) {
  #countdown.pop { animation: none; }
  .card, .btn { transition: none; }
}

/* menu & lobby additions */
.field { display: grid; gap: 4px; }
input[type="text"], #nameInput, #codeInput {
  width: 100%;
  min-width: 0;
  font: 800 19px var(--body);
  color: var(--ink);
  padding: 10px 12px;
  border: 4px solid var(--ink);
  border-radius: 16px;
  background: #fff;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
}
#nameInput:focus, #codeInput:focus { border-color: var(--blue-dark); }
.join-row { display: flex; gap: 10px; }
#codeInput { flex: 1.2; text-transform: uppercase; letter-spacing: 8px; text-align: center; font-family: var(--display); font-weight: 400; font-size: 26px; }
.join-row .btn { flex: 1; width: auto; }
.btn.ghost { background: #fff; color: var(--ink); }
.lobby-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.code { font-family: var(--display); font-size: clamp(42px, 11vw, 60px); letter-spacing: 10px; line-height: 1; color: var(--blue-dark); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.share { margin: 0; max-width: 30ch; font-weight: 800; font-size: 14px; color: var(--muted); min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { position: relative; border: 4px solid var(--ink); border-radius: 16px; background: #e9eef7; aspect-ratio: 3 / 4; max-width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; overflow: hidden; padding-bottom: 4px; }
.slot img { position: absolute; inset: 6px 0 24px; width: 100%; height: calc(100% - 30px); object-fit: contain; }
.slot .nm { position: relative; z-index: 1; font-weight: 900; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 5px; background: rgba(255, 255, 255, 0.88); border-radius: 8px; }
.slot.empty { border-style: dashed; justify-content: center; color: var(--muted); }
.slot.empty .nm { background: none; }
.slot .crown { position: absolute; top: 2px; left: 6px; font-size: 18px; z-index: 2; }
.slot .you { position: absolute; top: 4px; right: 6px; font-size: 11px; font-weight: 900; background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 5px; z-index: 2; }
.card.taken { opacity: 0.4; cursor: not-allowed; }
.card small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); min-height: 1.2em; }
.host-opts { display: grid; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--go-dark); }
</style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import * as SkeletonUtils from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/SkeletonUtils.js";

// ── rules & tuning (same as the online game) ───────────────────────────────
const TRACK_LEN = 700, LANES = 4, BASE_SPEED = 12, BOOST_SPEED = 18;
const COUNTDOWN_MS = 3500, RACE_LIMIT_MS = 90000, AFTER_FIRST_MS = 15000;
const LANE_W = 2.0, CHAR_H = 1.55, JUMP_V = 8.6, GRAVITY = 26, SLIDE_S = 0.75;
const STUMBLE_S = 0.8, INVULN_S = 1.4, BOOST_S = 1.6, LANE_SWITCH_SPEED = 9;
const VIEW_AHEAD = 120, VIEW_BEHIND = 20;
const RUNNERS = [
  { name: "Rex", color: "#ef4a3c", blurb: "barbarian" },
  { name: "Bolt", color: "#2f7df6", blurb: "goggles kid" },
  { name: "Ivy", color: "#2fbf55", blurb: "speedy" },
  { name: "Gizmo", color: "#f5b921", blurb: "robot" },
];
const LEVELS = {
  easy: { skill: [0.62, 0.72], react: [2.4, 6.2] },
  normal: { skill: [0.8, 0.9], react: [3.0, 5.4] },
  hard: { skill: [0.93, 0.985], react: [3.3, 4.9] },
};

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const laneX = (lane) => (lane - (LANES - 1) / 2) * LANE_W;
const ordinal = (n) => (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } },
};

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Rows of obstacles across the four lanes, plus boost pads (same generator as online). */
function buildCourse(seed) {
  const r = rng(seed);
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const rows = [], boosts = [];
  let z = 45;
  while (z < TRACK_LEN - 40) {
    const roll = r();
    let lanes;
    if (roll < 0.2) lanes = ["hurdle", "hurdle", "hurdle", "hurdle"];
    else if (roll < 0.38) lanes = ["gate", "gate", "gate", "gate"];
    else if (roll < 0.7) {
      lanes = [null, null, null, null].map(() => pick([null, null, "hurdle", "gate"]));
      const crates = 1 + Math.floor(r() * 2);
      const order = [0, 1, 2, 3];
      for (let i = 3; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      for (let i = 0; i < crates; i++) lanes[order[i]] = "crate";
    } else {
      let crates = 0;
      lanes = [0, 1, 2, 3].map(() => {
        const k = pick(["hurdle", "gate", "crate", null]);
        if (k === "crate" && crates >= 2) return "hurdle";
        if (k === "crate") crates++;
        return k;
      });
      if (lanes.every((k) => k === null)) lanes[Math.floor(r() * 4)] = "hurdle";
    }
    rows.push({ z: Math.round(z * 10) / 10, lanes });
    const gap = 15 + r() * 9;
    if (r() < 0.4) boosts.push({ z: Math.round((z + gap / 2) * 10) / 10, lane: Math.floor(r() * 4) });
    z += gap;
  }
  return { rows, boosts };
}

// ── sound: tiny WebAudio synth ─────────────────────────────────────────────
const sfx = (() => {
  let ctx = null;
  const ensure = () => {
    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === "suspended") ctx.resume();
    } catch { return null; }
    return ctx;
  };
  function tone(freq, dur, type = "square", vol = 0.12, slide = 0) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  return {
    unlock: ensure,
    beep: () => tone(520, 0.18, "square", 0.1),
    go: () => tone(880, 0.4, "square", 0.12),
    jump: () => tone(300, 0.2, "triangle", 0.15, 500),
    slide: () => tone(240, 0.22, "sawtooth", 0.05, -120),
    hit: () => tone(140, 0.35, "sawtooth", 0.18, -90),
    boost: () => tone(400, 0.35, "triangle", 0.14, 900),
    lane: () => tone(660, 0.06, "triangle", 0.06),
    finish: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, "square", 0.1), i * 110)),
  };
})();

// ── three.js world ─────────────────────────────────────────────────────────
const canvas = $("#scene");
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
} catch {
  $("#menuNote").textContent = "This browser can't show 3D (WebGL is turned off).";
  $("#menuNote").classList.add("err");
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 400);
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer?.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 78 : 62;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

scene.background = new THREE.Color("#8fd3ff");
scene.fog = new THREE.Fog("#cdeeff", 55, 150);
scene.add(new THREE.HemisphereLight("#e6f6ff", "#5fae3a", 1.35));
const sun = new THREE.DirectionalLight("#fff4d6", 1.6);
sun.position.set(-6, 14, 8);
scene.add(sun);

const texLoader = new THREE.TextureLoader();
texLoader.load("assets/sky.jpg", (t) => { t.colorSpace = THREE.SRGBColorSpace; scene.background = t; });
function grass(repeatX, repeatY) {
  const t = texLoader.load("assets/grass.jpg");
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  t.repeat.set(repeatX, repeatY);
  return t;
}
const GROUND_LEN = TRACK_LEN + 260;
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, GROUND_LEN), new THREE.MeshLambertMaterial({ map: grass(18, GROUND_LEN / 5) }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.z = -GROUND_LEN / 2 + 60;
  scene.add(ground);

const loader = new GLTFLoader();

/**
 * Models ship as glTF JSON with the binary buffer inlined as base64 (the page
 * host doesn't serve .glb). The page's security policy blocks fetching data:
 * URLs, so decode the buffer here and hand the loader an in-memory GLB.
 */
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const json = await res.json();
  const buf = json.buffers[0];
  const b64 = buf.uri.slice(buf.uri.indexOf(",") + 1);
  const raw = atob(b64);
  const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  delete buf.uri;
  buf.byteLength = bin.length;
  let jsonBytes = new TextEncoder().encode(JSON.stringify(json));
  const jsonPad = (4 - (jsonBytes.length % 4)) % 4;
  const binPad = (4 - (bin.length % 4)) % 4;
  const total = 12 + 8 + jsonBytes.length + jsonPad + 8 + bin.length + binPad;
  const out = new Uint8Array(total);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546c67, true);
  dv.setUint32(4, 2, true);
  dv.setUint32(8, total, true);
  dv.setUint32(12, jsonBytes.length + jsonPad, true);
  dv.setUint32(16, 0x4e4f534a, true);
  out.set(jsonBytes, 20);
  out.fill(0x20, 20 + jsonBytes.length, 20 + jsonBytes.length + jsonPad);
  const binAt = 20 + jsonBytes.length + jsonPad;
  dv.setUint32(binAt, bin.length + binPad, true);
  dv.setUint32(binAt + 4, 0x004e4942, true);
  out.set(bin, binAt + 8);
  const base = url.slice(0, url.lastIndexOf("/") + 1);
  return new Promise((resolve, reject) => loader.parse(out.buffer, base, resolve, reject));
}

/** Static prop: long side across the lane, centred, base on the ground. */
function fitProp(root, { width, height, maxHeight }) {
  const size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  const holder = new THREE.Group(), inner = new THREE.Group();
  inner.add(root); holder.add(inner);
  if (size.z > size.x * 1.15) inner.rotation.y = Math.PI / 2;
  holder.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(inner);
  const s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -b.min.y, -c.z);
  const k = width ? width / s.x : height / s.y;
  holder.scale.setScalar(k);
  if (maxHeight && s.y * k > maxHeight) holder.scale.y = maxHeight / s.y;
  return holder;
}

function stripRootMotion(clip) {
  for (const tr of clip.tracks) {
    if (!/Hips\.position$/.test(tr.name)) continue;
    const v = tr.values;
    for (let i = 3; i < v.length; i += 3) { v[i] = v[0]; v[i + 2] = v[2]; }
  }
  return clip;
}

async function loadChar(i) {
  const gltf = await loadGLB(`assets/c${i}.json`);
  const clips = {};
  for (const c of gltf.animations) clips[c.name.toLowerCase()] = stripRootMotion(c);
  if (!clips.run) {
    const run = gltf.animations.find((c) => /run/i.test(c.name));
    if (run) clips.run = run;
  }
  gltf.scene.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  // measure the POSED skinned mesh; bind-pose bounds of skinned meshes are unreliable
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const probe = clips.idle || clips.run;
  if (probe) { mixer.clipAction(probe).play(); mixer.update(0); }
  gltf.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(gltf.scene, true);
  mixer.stopAllAction();
  mixer.uncacheRoot(gltf.scene);
  return { scene: gltf.scene, clips, scale: CHAR_H / (box.max.y - box.min.y || 1), footY: box.min.y };
}

async function loadAll(onProgress) {
  const jobs = [
    ...[0, 1, 2, 3].map((i) => loadChar(i).then((c) => (assets.chars[i] = c))),
    loadGLB("assets/hurdle.json").then((g) => (assets.props.hurdle = fitProp(g.scene, { width: 1.75, maxHeight: 0.75 }))),
    loadGLB("assets/gate.json").then((g) => (assets.props.gate = fitProp(g.scene, { width: 1.9, maxHeight: 2.15 }))),
    loadGLB("assets/crate.json").then((g) => (assets.props.crate = fitProp(g.scene, { width: 1.55 }))),
    loadGLB("assets/tree.json").then((g) => (assets.props.tree = fitProp(g.scene, { height: 4.2 }))),
  ];
  let done = 0;
  await Promise.all(jobs.map((j) => j.then(() => onProgress(++done / jobs.length))));
}

// ── runner physics: you, and computer runners on the host's page ───────────
class Runner {
  constructor(lane, isMe, skill = 1, reactRange = [3, 5]) {
    Object.assign(this, {
      lane, x: lane, d: 0, y: 0, vy: 0, slideT: 0, stumbleT: 0, invulnT: 0, boostT: 0,
      speed: 0, hits: 0, finish: null, isMe, skill, reactRange, decided: -1,
      react: reactRange[0] + Math.random() * (reactRange[1] - reactRange[0]),
    });
  }
  jump() {
    if (this.y <= 0.001 && this.stumbleT <= 0 && this.finish === null) {
      this.vy = JUMP_V; this.y = 0.001; this.slideT = 0;
      if (this.isMe) sfx.jump();
    }
  }
  slide() {
    if (this.finish !== null) return;
    if (this.y > 0.001) { this.vy = Math.min(this.vy, -16); this.slideT = SLIDE_S; }
    else if (this.stumbleT <= 0) { this.slideT = SLIDE_S; if (this.isMe) sfx.slide(); }
  }
  shift(dir) {
    if (this.finish !== null) return;
    const next = clamp(this.lane + dir, 0, LANES - 1);
    if (next !== this.lane) { this.lane = next; if (this.isMe) sfx.lane(); }
  }
  act() {
    if (!race.started) return "idle";
    if (this.finish !== null && this.speed < 0.5) return "cheer";
    if (this.stumbleT > 0) return "stumble";
    if (this.y > 0) return "jump";
    if (this.slideT > 0) return "slide";
    return "run";
  }
  step(dt, course, raceMs) {
    const dx = this.lane - this.x, stepX = LANE_SWITCH_SPEED * dt;
    this.x = Math.abs(dx) <= stepX ? this.lane : this.x + Math.sign(dx) * stepX;
    if (this.y > 0 || this.vy > 0) {
      this.vy -= GRAVITY * dt;
      this.y += this.vy * dt;
      if (this.y <= 0) { this.y = 0; this.vy = 0; }
    }
    if (this.y <= 0) this.slideT = Math.max(0, this.slideT - dt);
    this.stumbleT = Math.max(0, this.stumbleT - dt);
    this.invulnT = Math.max(0, this.invulnT - dt);
    this.boostT = Math.max(0, this.boostT - dt);
    if (!race.started) { this.speed = 0; return; }

    let target = this.boostT > 0 ? BOOST_SPEED : BASE_SPEED;
    if (this.stumbleT > 0) target = 3.5;
    if (this.finish !== null) target = this.d > TRACK_LEN + 14 ? 0 : 6;
    const accel = this.stumbleT > 0 ? 40 : 14;
    this.speed += clamp(target - this.speed, -accel * dt, accel * dt);
    const prevD = this.d;
    this.d += this.speed * dt;

    if (this.finish === null && this.d >= TRACK_LEN) {
      this.finish = Math.max(1, Math.round(raceMs));
      if (this.isMe) { sfx.finish(); banner("FINISH!", 1800); }
    }
    if (this.finish !== null) return;

    for (const row of course.rows) {
      if (row.z < prevD - 0.6 || row.z > this.d + 0.6) continue;
      for (let lane = 0; lane < LANES; lane++) {
        const kind = row.lanes[lane];
        if (!kind) continue;
        if (Math.abs(this.x - lane) > (kind === "crate" ? 0.58 : 0.62)) continue;
        const clear = (kind === "hurdle" && this.y > 0.62) || (kind === "gate" && this.slideT > 0);
        if (!clear) this.hit(kind);
      }
    }
    for (const b of course.boosts) {
      if (b.z < prevD - 1 || b.z > this.d + 1) continue;
      if (Math.abs(this.x - b.lane) < 0.5 && this.y < 0.5 && this.boostT < BOOST_S - 0.2) {
        this.boostT = BOOST_S;
        if (this.isMe) { sfx.boost(); banner("BOOST!", 700); }
      }
    }
  }
  hit(kind) {
    if (this.invulnT > 0) return;
    this.hits += 1;
    this.stumbleT = STUMBLE_S; this.invulnT = INVULN_S; this.boostT = 0; this.slideT = 0;
    if (this.isMe) {
      shake = 0.35;
      sfx.hit();
      banner(kind === "hurdle" ? "Jump! ↑" : kind === "gate" ? "Slide! ↓" : "Dodge! ← →", 800);
    }
  }
  /** Computer runner: look at the next row and react, with a skill-based chance to fumble. */
  think(course, rand) {
    if (!race.started || this.finish !== null || this.stumbleT > 0) return;
    const idx = course.rows.findIndex((r) => r.z > this.d + 0.4);
    if (idx < 0) return;
    const row = course.rows[idx];
    const dist = row.z - this.d;
    const here = row.lanes[this.lane];
    if (here === "crate") {
      if (dist < 11 && this.decided !== idx + 0.5) {
        this.decided = idx + 0.5;
        if (rand() < this.skill) {
          const free = [0, 1, 2, 3].filter((l) => row.lanes[l] !== "crate")
            .sort((a, b) => Math.abs(a - this.lane) - Math.abs(b - this.lane) || (row.lanes[a] ? 1 : 0) - (row.lanes[b] ? 1 : 0))[0];
          if (free !== undefined) this.shift(Math.sign(free - this.lane));
        }
      } else if (dist < 8 && this.lane === Math.round(this.x) && rand() < this.skill * 0.05) {
        const free = [0, 1, 2, 3].filter((l) => row.lanes[l] !== "crate").sort((a, b) => Math.abs(a - this.lane) - Math.abs(b - this.lane))[0];
        if (free !== undefined) this.shift(Math.sign(free - this.lane));
      }
      return;
    }
    if (this.decided === idx || dist > this.react) return;
    this.decided = idx;
    this.react = this.reactRange[0] + rand() * (this.reactRange[1] - this.reactRange[0]);
    if (rand() > this.skill) return; // fumble: run straight into it
    if (here === "hurdle") this.jump();
    else if (here === "gate") this.slide();
  }
}

function animateModel(m, s, dt, blink) {
  m.group.position.set(laneX(s.x), s.y, -s.d);
  const a = s.act;
  if (a === "jump") m.play("jump", 0.08, (m.duration("jump") / 0.75) * 0.9);
  else if (a === "slide") m.play("slide", 0.08, m.duration("slide") / SLIDE_S);
  else if (a === "cheer") m.play("cheer", 0.25);
  else if (a === "idle") m.play("idle", 0.25);
  else m.play("run", 0.12, clamp((s.speed || BASE_SPEED) / BASE_SPEED, 0.45, 1.45));

  m.pivot.rotation.x = a === "stumble" ? 0.25 : 0;
  m.shadow.position.y = 0.04 - s.y;
  m.group.visible = !s.left && !blink;
  m.mixer.update(dt);
}

/** People in this lobby, oldest first (the first one is the host). */
function humans() {
  if (!session.nr) return [];
  let list = session.nr.peers().filter((p) => p.kind === "viewer");
  list = list.map((p) => (p.sameTab ? { ...p, presence: { ...p.presence, ...session.pres } } : p));
  if (!list.some((p) => p.sameTab)) list.push({ peer: "me", sameTab: true, isMe: true, kind: "viewer", presence: session.pres });
  return list
    .filter((p) => p.presence && typeof p.presence.n === "string")
    .sort((a, b) => num(a.presence.t) - num(b.presence.t) || (a.peer < b.peer ? -1 : 1));
}
const hostPeer = () => humans()[0] || null;
const amHost = () => session.kind === "solo" || hostPeer()?.sameTab === true;

/** Who races: the first four people, each with a distinct runner, plus computer runners. */
function lineup(game) {
  const used = new Set();
  const out = [];
  const people = session.kind === "solo" ? [{ sameTab: true, peer: "me", presence: { n: myName(), c: choice.char } }] : humans().slice(0, 4);
  for (const p of people) {
    let c = num(p.presence.c, 0);
    if (!(c >= 0 && c < 4) || used.has(c)) c = [0, 1, 2, 3].find((x) => !used.has(x));
    used.add(c);
    out.push({ kind: p.sameTab ? "me" : "remote", key: p.peer, name: cleanText(p.presence.n, 14) || RUNNERS[c].name, char: c });
  }
  if (game.fill) {
    let k = 0;
    for (const c of [0, 1, 2, 3]) {
      if (used.has(c) || out.length >= 4) continue;
      out.push({ kind: "bot", key: `bot${k}`, botIndex: k++, name: `${RUNNERS[c].name} (CPU)`, char: c });
    }
  }
  return out;
}

  return cleanText($("#nameInput").value, 14) || "Runner";
}

// ── race ───────────────────────────────────────────────────────────────────
function beginRace(game) {
  sfx.unlock();
  clearRace();
  hideShowcase();
  session.lastRound = game.round;
  race.round = game.round;
  race.course = buildCourse(game.seed);
  race.rand = rng(game.seed ^ 0x9e3779b9);
  buildCourseObjects(race.course);
  const lv = LEVELS[LEVELS[game.level] ? game.level : "normal"];
  const iSimulate = amHost();
  race.racers = lineup(game).map((r, lane) => {
    const e = { ...r, lane, left: false, view: { d: 0, x: lane, y: 0, act: "idle", fin: null, hits: 0, speed: 0, left: false }, lastD: 0, lastAt: performance.now(), vel: 0 };
    if (r.kind === "me") e.runner = new Runner(lane, true);
    if (r.kind === "bot" && iSimulate) e.runner = new Runner(lane, false, lv.skill[0] + race.rand() * (lv.skill[1] - lv.skill[0]), lv.react);
    e.model = makeModel(r.char, r.kind === "me" ? false : r.name);
    scene.add(e.model.group);
    return e;
  });
  race.me = race.racers.find((r) => r.kind === "me")?.runner ?? null;
  race.t0 = performance.now() + COUNTDOWN_MS;
  race.active = true;
  race.started = false;
  race.ended = false;
  race.firstFinishAt = null;
  lastCount = null;
  pub({ r: game.round, d: 0, l: race.racers.find((r) => r.kind === "me")?.lane ?? 0, y: 0, a: "idle", h: 0, f: null, b: null });

  $("#dots").replaceChildren(...race.racers.map((r) => {
    const d = document.createElement("div");
    d.className = `dot${r.kind === "me" ? " me" : ""}`;
    d.style.background = RUNNERS[r.char].color;
    return d;
  }));
  mode = "race";
  show("hud");
  const hint = $("#hint");
  hint.style.opacity = "1";
  setTimeout(() => (hint.style.opacity = "0"), 6000);
}

function clearRace() {
  for (const r of race.racers) scene.remove(r.model.group);
  race.racers = [];
  race.me = null;
  race.active = false;
}

function racerState(r) {
  if (r.runner) {
    const u = r.runner;
    return { d: u.d, x: u.x, y: u.y, act: u.act(), fin: u.finish, hits: u.hits, speed: u.speed, left: false };
  }
  return r.view;
}

function standings() {
  return race.racers.slice().sort((a, b) => {
    const A = racerState(a), B = racerState(b);
    if (A.left !== B.left) return A.left ? 1 : -1;
    if (A.fin !== null && B.fin !== null) return A.fin - B.fin;
    if (A.fin !== null) return -1;
    if (B.fin !== null) return 1;
    return B.d - A.d;
  });
}

/** Pull other racers' latest state out of the room (people) and the host (computer runners). */
function syncRemote(now) {
  if (session.kind !== "room") return;
  const people = new Map(humans().map((p) => [p.peer, p]));
  const host = hostPeer();
  for (const r of race.racers) {
    if (r.runner) continue;
    let src = null;
    if (r.kind === "remote") {
      const p = people.get(r.key);
      if (!p) { r.view.left = true; continue; }
      if (num(p.presence.r) === race.round) src = p.presence;
    } else if (r.kind === "bot" && host && num(host.presence.r) === race.round && Array.isArray(host.presence.b)) {
      src = host.presence.b[r.botIndex] || null;
    }
    if (!src) continue;
    const d = clamp(num(src.d), 0, TRACK_LEN);
    if (d !== r.lastD) {
      const dt = (now - r.lastAt) / 1000;
      if (dt > 0.02) r.vel = clamp((d - r.lastD) / dt, 0, BOOST_SPEED + 2);
      r.lastD = d;
      r.lastAt = now;
    }
    r.target = { lane: clamp(Math.round(num(src.l, r.lane)), 0, LANES - 1), y: clamp(num(src.y), 0, 5), act: ACTS.includes(src.a) ? src.a : "run" };
    r.view.fin = typeof src.f === "number" && src.f > 0 ? src.f : null;
    r.view.hits = clamp(Math.round(num(src.h)), 0, 999);
  }
}

function stepRemoteViews(dt, now) {
  for (const r of race.racers) {
    if (r.runner || !r.target) continue;
    const v = r.view;
    const age = (now - r.lastAt) / 1000;
    const target = Math.min(TRACK_LEN, r.lastD + r.vel * Math.min(age, 0.5));
    v.d += (target - v.d) * Math.min(1, dt * 8);
    v.x += (r.target.lane - v.x) * Math.min(1, dt * 12);
    v.y += (r.target.y - v.y) * Math.min(1, dt * 18);
    v.speed = r.vel || BASE_SPEED;
    v.act = v.fin !== null && v.d > TRACK_LEN - 1 ? "cheer" : race.started ? r.target.act : "idle";
  }
}

function publishMine(now, force) {
  if (session.kind !== "room" || !race.me) return;
  const me = race.me;
  const a = me.act();
  if (!force && now - session.lastPub < 66 && a === session.lastAct) return;
  session.lastPub = now;
  session.lastAct = a;
  const patch = { r: race.round, d: Math.round(Math.min(me.d, TRACK_LEN) * 100) / 100, l: me.lane, y: Math.round(me.y * 100) / 100, a, h: me.hits, f: me.finish };
  if (amHost()) {
    patch.b = race.racers.filter((r) => r.kind === "bot" && r.runner).map((r) => {
      const u = r.runner;
      return { d: Math.round(Math.min(u.d, TRACK_LEN) * 100) / 100, l: u.lane, y: Math.round(u.y * 100) / 100, a: u.act(), h: u.hits, f: u.finish };
    });
  }
  pub(patch);
}

function endRace() {
  race.ended = true;
  const order = standings();
  const meEntry = race.racers.find((r) => r.kind === "me");
  const mine = meEntry ? racerState(meEntry) : null;
  const place = meEntry ? order.indexOf(meEntry) + 1 : 0;
  $("#resTitle").textContent = !mine ? "Race over" : mine.fin === null ? "Time's up!" : place === 1 ? "You win!" : `You came ${place}${ordinal(place)}`;
  const list = $("#podium");
  list.replaceChildren();
  order.forEach((r, i) => {
    const s = racerState(r);
    const li = document.createElement("li");
    if (r.kind === "me") li.className = "me";
    const pl = document.createElement("span"); pl.className = "pl"; pl.textContent = ["🥇", "🥈", "🥉", "4"][i] ?? String(i + 1);
    const img = document.createElement("img"); img.src = `assets/p${r.char}.png`; img.alt = "";
    const who = document.createElement("span"); who.className = "who"; who.textContent = r.kind === "me" ? `${r.name} (you)` : r.name;
    const small = document.createElement("small");
    small.textContent = s.left ? "left the race" : s.fin !== null ? `${RUNNERS[r.char].name} · ${s.hits} bump${s.hits === 1 ? "" : "s"}` : `${Math.round(s.d)} m of ${TRACK_LEN} m`;
    who.append(small);
    const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = s.fin !== null ? `${(s.fin / 1000).toFixed(2)}s` : "DNF";
    li.append(pl, img, who, tm);
    list.append(li);
  });
  let bestText = "";
  if (mine && mine.fin !== null) {
    const key = "lr:best";
    const prev = Number(store.get(key)) || 0;
    if (!prev || mine.fin < prev) { store.set(key, String(mine.fin)); bestText = prev ? "New personal best!" : `Personal best: ${(mine.fin / 1000).toFixed(2)}s`; }
    else bestText = `Personal best: ${(prev / 1000).toFixed(2)}s`;
  }
  $("#best").textContent = bestText;
  banner(mine && mine.fin === null ? "TIME UP!" : "FINISHED!", 1400);
  setTimeout(() => { if (race.ended && mode === "race") { mode = "results"; renderResultsButtons(); show("results"); } }, 1500);
}

function renderResultsButtons() {
  const host = amHost();
  $("#againBtn").hidden = !host;
  $("#lobbyBtn").hidden = !(host && session.kind === "room");
  $("#resNote").textContent = host ? "" : "Waiting for the host to start the next race…";
}

// ── lobby ──────────────────────────────────────────────────────────────────
function newCode() {
  const buf = new Uint32Array(4);
  crypto.getRandomValues(buf);
  return Array.from(buf, (v) => CODE_ALPHABET[v % CODE_ALPHABET.length]).join("");
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function enterRoom(code, creating) {
  if (!roomApi) return;
  setMenuBusy(true, creating ? "Creating lobby…" : `Joining ${code}…`);
  try {
    const nr = await roomApi.join(`lr-${code.toLowerCase()}`);
    session.kind = "room";
    session.nr = nr;
    session.code = code;
    session.game = null;
    session.pres = {};
    pub({ t: Date.now(), n: myName(), c: choice.char });
    const others = () => humans().filter((p) => !p.sameTab);
    if (creating) {
      await wait(1200);
      if (others().some((p) => num(p.presence.t) < session.pres.t)) {
        await leaveRoom(true);
        return enterRoom(newCode(), true);
      }
    } else {
      let found = false;
      for (let i = 0; i < 30 && !found; i++) { await wait(100); found = others().length > 0; }
      if (!found) {
        await leaveRoom(true);
        setMenuBusy(false, `No lobby “${code}” is open. Check the code and that your friend still has the lobby open.`, true);
        return;
      }
      const ahead = humans().findIndex((p) => p.sameTab);
      if (ahead >= 4) {
        await leaveRoom(true);
        setMenuBusy(false, "That lobby already has 4 runners.", true);
        return;
      }
      session.lastRound = num(hostPeer()?.presence.g?.round);
    }
    setMenuBusy(false, "");
    enterLobby();
  } catch (err) {
    console.error(err);
    await leaveRoom(true);
    setMenuBusy(false, "Couldn't open the live lobby. Try again in a moment.", true);
  }
}

async function leaveRoom(silent) {
  const nr = session.nr;
  session.nr = null;
  session.kind = null;
  session.game = null;
  if (nr) { try { await nr.leave(); } catch { /* already gone */ } }
  if (!silent) toMenu();
}

function enterLobby() {
  mode = "lobby";
  clearRace();
  buildCourseObjects({ rows: [], boosts: [] });
  show("lobby");
  lobbySig = "";
  renderLobby();
}

let lobbySig = "";
function renderLobby() {
  const people = humans();
  const host = amHost();
  const meIdx = people.findIndex((p) => p.sameTab);
  // two people on one runner: the later one moves to a free runner
  const earlier = new Set(people.slice(0, Math.max(0, meIdx)).map((p) => num(p.presence.c)));
  if (earlier.has(choice.char)) {
    const free = [0, 1, 2, 3].find((c) => !earlier.has(c));
    if (free !== undefined) { choice.char = free; pub({ c: free }); setShowcase(free); }
  }
  const hg = hostPeer()?.presence.g;
  const racing = !host && hg && hg.phase === "race" && num(hg.round) <= session.lastRound && num(hostPeer()?.presence.r) === num(hg.round) && hostPeer()?.presence.f == null;
  const sig = JSON.stringify([people.map((p) => [p.peer, p.presence.n, p.presence.c]), host, choice, racing]);
  if (sig === lobbySig) return;
  lobbySig = sig;

  $("#lobbyCode").textContent = session.code;
  const slots = $("#slots");
  slots.replaceChildren();
  for (let i = 0; i < 4; i++) {
    const p = people[i];
    const s = document.createElement("div");
    const nm = document.createElement("span");
    nm.className = "nm";
    if (!p) {
      s.className = "slot empty";
      nm.textContent = choice.fill && host ? "Computer" : "Waiting…";
      s.append(nm);
    } else {
      const c = num(p.presence.c);
      s.className = "slot";
      s.style.background = `${RUNNERS[c]?.color ?? "#888888"}33`;
      const img = document.createElement("img"); img.src = `assets/p${c}.png`; img.alt = "";
      nm.textContent = cleanText(p.presence.n, 14) || "Runner";
      s.append(img, nm);
      if (i === 0) { const cr = document.createElement("span"); cr.className = "crown"; cr.textContent = "👑"; s.append(cr); }
      if (p.sameTab) { const y = document.createElement("span"); y.className = "you"; y.textContent = "YOU"; s.append(y); }
    }
    slots.append(s);
  }
  const watching = people.length - 4;

  const picker = $("#lobbyPicker");
  picker.replaceChildren();
  RUNNERS.forEach((r, i) => {
    const owner = people.find((p) => !p.sameTab && num(p.presence.c) === i);
    const b = document.createElement("button");
    b.type = "button";
    b.className = `card${owner ? " taken" : ""}`;
    b.setAttribute("aria-pressed", String(choice.char === i));
    const img = document.createElement("img"); img.src = `assets/p${i}.png`; img.alt = "";
    const name = document.createElement("b"); name.textContent = r.name; name.style.color = r.color;
    const small = document.createElement("small"); small.textContent = choice.char === i ? "You" : owner ? cleanText(owner.presence.n, 14) : "";
    b.append(img, name, small);
    b.addEventListener("click", () => {
      if (owner) return;
      choice.char = i;
      store.set("lr:char", String(i));
      pub({ c: i });
      setShowcase(i);
      lobbySig = "";
      renderLobby();
    });
    picker.append(b);
  });

  $("#hostOpts").hidden = !host;
  $("#fillBots").checked = choice.fill;
  for (const b of document.querySelectorAll("#lobbyLevel button")) b.setAttribute("aria-pressed", String(b.dataset.level === choice.level));
  $("#startBtn").hidden = !host;
  const n = Math.min(people.length, 4);
  $("#startBtn").textContent = n >= 2 ? `Start race (${n} players)` : "Start race";
  $("#lobbyNote").textContent = racing
    ? "A race is running right now. You'll be in the next one."
    : host
      ? n < 2 ? "Share the code. Friends can join until you press Start." : watching > 0 ? `${watching} more watching (4 runners max).` : ""
      : "Waiting for the host to start…";
}

function hostStart() {
  const g = {
    round: Math.max(session.lastRound, num(session.game?.round)) + 1,
    seed: (Math.random() * 2 ** 31) >>> 0,
    level: choice.level,
    fill: session.kind === "solo" ? true : choice.fill,
    phase: "race",
  };
  session.game = g;
  if (session.kind === "room") pub({ g });
  beginRace(g);
}

/** Non-hosts follow the host's game: start when a new round appears, return to the lobby with them. */
function followHost() {
  if (session.kind !== "room" || amHost()) return;
  const g = hostPeer()?.presence.g;
  if (!g || typeof g !== "object") return;
  if (g.phase === "race" && num(g.round) > session.lastRound && Number.isFinite(g.seed)) {
    const mine = humans().findIndex((p) => p.sameTab);
    if (mine >= 0 && mine < 4) beginRace({ round: num(g.round), seed: num(g.seed), level: g.level, fill: !!g.fill });
    else session.lastRound = num(g.round);
  } else if (g.phase === "lobby" && mode === "results") {
    enterLobby();
  }
}

// ── input ──────────────────────────────────────────────────────────────────
function input(kind) {
  const me = race.me;
  if (!race.active || !race.started || !me || me.finish !== null) return;
  if (kind === "left") me.shift(-1);
  else if (kind === "right") me.shift(1);
  else if (kind === "jump") me.jump();
  else if (kind === "slide") me.slide();
}
window.addEventListener("keydown", (e) => {
  if (!race.active || e.target instanceof HTMLInputElement) return;
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") input("left");
  else if (k === "ArrowRight" || k === "d" || k === "D") input("right");
  else if (k === "ArrowUp" || k === "w" || k === "W" || k === " ") input("jump");
  else if (k === "ArrowDown" || k === "s" || k === "S") input("slide");
  else return;
  e.preventDefault();
});
{
  let sx = 0, sy = 0, used = false, tracking = false;
  canvas.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; used = false; tracking = true; sfx.unlock(); }, { passive: true });
  canvas.addEventListener("touchmove", (e) => {
    if (!tracking || used) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
    used = true;
    if (Math.abs(dx) > Math.abs(dy)) input(dx < 0 ? "left" : "right"); else input(dy < 0 ? "jump" : "slide");
  }, { passive: true });
  canvas.addEventListener("touchend", () => { if (tracking && !used) input("jump"); tracking = false; }, { passive: true });
  canvas.addEventListener("mousedown", () => input("jump"));
}

// ── UI ─────────────────────────────────────────────────────────────────────
function show(name) {

  $("#hud").hidden = name !== "hud";
}
let bannerTimer = 0;

let modelsReady = false;

const picker = $("#picker");

const nameInput = $("#nameInput");

// menu showcase: your runner idling on the start line
let showcase = null;
function setShowcase(charIdx) {
  if (!assets.chars[charIdx]) return;
  if (showcase?.char === charIdx) return;
  hideShowcase();
  const m = makeModel(charIdx, false);
  m.group.position.set(0, 0, -3);
  m.play("idle", 0);
  scene.add(m.group);
  showcase = { char: charIdx, m };
}
function hideShowcase() {
  if (showcase) scene.remove(showcase.m.group);
  showcase = null;
}

// ── frame loop ─────────────────────────────────────────────────────────────
let last = performance.now();
let lastUiTick = 0;
const camPos = new THREE.Vector3(0, 4, 8), camGoal = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if (now - lastUiTick > 200) {
    lastUiTick = now;
    if (mode === "lobby") { renderLobby(); followHost(); }
    else if (mode === "results") { followHost(); renderResultsButtons(); }
  }

  if (race.active) {
    const raceMs = now - race.t0;
    race.started = raceMs >= 0;
    syncRemote(now);
    const steps = Math.ceil(dt / (1 / 120));
    for (let i = 0; i < steps; i++) {
      for (const r of race.racers) {
        if (!r.runner) continue;
        if (r.kind === "bot") r.runner.think(race.course, race.rand);
        r.runner.step(dt / steps, race.course, raceMs);
      }
    }
    stepRemoteViews(dt, now);
    const meRunner = race.me;
    for (const r of race.racers) {
      const s = racerState(r);
      const blink = r.kind === "me" && meRunner.invulnT > 0 && meRunner.stumbleT <= 0 && Math.floor(now / 90) % 2 === 0;
      animateModel(r.model, s, dt, blink);
      if (s.fin !== null && race.firstFinishAt === null) race.firstFinishAt = raceMs;
    }
    publishMine(now, false);

    if (!race.ended) {
      const live = race.racers.map(racerState).filter((s) => !s.left);
      const allIn = live.length > 0 && live.every((s) => s.fin !== null);
      const grace = race.firstFinishAt !== null && raceMs >= race.firstFinishAt + AFTER_FIRST_MS;
      if (allIn || grace || raceMs >= RACE_LIMIT_MS) endRace();
    }

    const focus = meRunner ? { d: meRunner.d, x: meRunner.x, y: meRunner.y } : racerState(race.racers[0]);
    const tx = laneX(focus.x) * 0.75;
    camGoal.set(tx, 3.0 + focus.y * 0.35, -focus.d + 5.6);
    camPos.lerp(camGoal, Math.min(1, dt * 6));
    camera.position.copy(camPos);
    if (shake > 0) {
      shake = Math.max(0, shake - dt);
      camera.position.x += (Math.random() - 0.5) * shake * 0.6;
      camera.position.y += (Math.random() - 0.5) * shake * 0.6;
    }
    camLook.set(tx * 0.8, 1.0, -focus.d - 9);
    camera.lookAt(camLook);
    cull(focus.d);
    updateHud(raceMs);
  } else {
    const t = now / 1000;
    camera.position.set(Math.sin(t * 0.15) * 1.2, 1.6, 1.4);
    camera.lookAt(0, 0.9, -3);
    if (showcase) {
      showcase.m.pivot.rotation.y = 0.35 + Math.sin(t * 0.6) * 0.25;
      showcase.m.mixer.update(dt);
    }
    cull(0);
  }
  renderer?.render(scene, camera);
}

function updateHud(raceMs) {
  const cd = $("#countdown");
  let label = "";
  if (raceMs < -3000) label = "Ready?";
  else if (raceMs < 0) label = String(Math.ceil(-raceMs / 1000));
  else if (raceMs < 700) label = "GO!";
  if (label !== lastCount) {
    cd.textContent = label;
    cd.classList.remove("pop");
    void cd.offsetWidth;
    if (label) cd.classList.add("pop");
    if (label === "GO!") sfx.go(); else if (/^[123]$/.test(label)) sfx.beep();
    lastCount = label;
  }
  const meEntry = race.racers.find((r) => r.kind === "me");
  const mine = meEntry ? racerState(meEntry) : null;
  const t = Math.max(0, raceMs);
  $("#timer").textContent = race.firstFinishAt !== null && mine && mine.fin === null
    ? `⏱${Math.max(0, Math.ceil((race.firstFinishAt + AFTER_FIRST_MS - raceMs) / 1000))}`
    : (((mine && mine.fin) ?? t) / 1000).toFixed(1);
  const order = standings();
  const place = meEntry ? order.indexOf(meEntry) + 1 : 1;
  $("#place").innerHTML = `${place}<sup>${ordinal(place)}</sup>`;
  [...$("#dots").children].forEach((dot, i) => {
    const s = racerState(race.racers[i]);
    dot.style.left = `${clamp(s.d / TRACK_LEN, 0, 1) * 100}%`;
    dot.hidden = s.left;
  });
}

// ── boot ───────────────────────────────────────────────────────────────────
renderMenu();
show("menu");
requestAnimationFrame(frame);
loadAll((f) => ($("#createBtn").textContent = `Loading 3D models… ${Math.round(f * 100)}%`))
  .then(() => {
    modelsReady = true;
    buildScenery();
    renderMenu();
    setMenuBusy(false, roomApi ? "" : $("#menuNote").textContent);
  })
  .catch((err) => {
    console.error(err);
    $("#createBtn").textContent = "Couldn't load";
    setMenuBusy(true, `The 3D models didn't load (${String(err?.message || err).slice(0, 120)}). Reload the page to try again.`, true);
  });

// live lobbies light up when the room capability is available in this view
(window.claude?.use ? window.claude.use("room") : Promise.resolve(null)).then((api) => {
  roomApi = api;
  if (!api) {
    setMenuBusy(false, "Live lobbies work when this page is open in Claude and you're signed in. You can still practice alone.");
    return;
  }
  setMenuBusy(false, "");
  const params = new URLSearchParams(location.search);
  const code = (location.hash.replace("#", "") || params.get("join") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (code.length === 4) codeInput.value = code;
}).catch(() => setMenuBusy(false, "Live lobbies aren't available here. You can still practice alone."));

</script>
