# Fly.io: `fly launch --copy-config --no-deploy && fly volumes create tumble_data --size 1 && fly deploy`
app = "tumble-royale"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "tumble_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # rooms live in memory: keep the machine running
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
